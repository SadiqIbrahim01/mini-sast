name: Release

# Triggered when you push a version tag:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Produces:
#   1. Docker image at ghcr.io/sadiqibrahim01/mini-sast:0.1.0
#   2. Docker image at ghcr.io/sadiqibrahim01/mini-sast:latest
#   3. GitHub Release with fat JAR attached

on:
  push:
    tags:
      - 'v*'                    # v0.1.0, v1.0.0, v2.0.0-beta, etc.

permissions:
  contents: write               # create GitHub Releases
  packages: write               # push to ghcr.io

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history for release notes

      # ── Java build ───────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build all modules (skip tests — already passed in CI)
        run: mvn --no-transfer-progress --batch-mode clean package -DskipTests

      # ── Docker ───────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is automatically available in all workflows.
          # No manual secret setup required for ghcr.io.

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mini-sast
          # Tags generated automatically from the git tag:
          #   git tag v0.1.0 → produces:
          #     ghcr.io/.../mini-sast:0.1.0    (semver without v prefix)
          #     ghcr.io/.../mini-sast:0.1       (major.minor)
          #     ghcr.io/.../mini-sast:latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Mini SAST
            org.opencontainers.image.description=Static Application Security Testing Tool
            org.opencontainers.image.licenses=MIT

      - name: Build and push CLI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cli
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── GitHub Release ────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Attach the fat JAR so users can download without Docker
          files: cli/target/mini-sast-cli-*-standalone.jar
          # Auto-generates release notes from commit messages since last tag
          generate_release_notes: true
          # Mark as pre-release if tag contains - (e.g. v1.0.0-beta)
          prerelease: ${{ contains(github.ref_name, '-') }}