name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test — Java ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ 21 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build & run all tests
        run: mvn --no-transfer-progress --batch-mode clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java }}
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

      - name: Upload CLI fat JAR
        if: success() && matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: mini-sast-cli-snapshot
          path: cli/target/*-standalone.jar
          retention-days: 14

  # ── Docker build verification ────────────────────────────────
  # Verifies the image builds on every push.
  # Does NOT push (no registry credentials needed).
  # A broken Dockerfile is caught here before it blocks a release.
  docker-verify:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test          # only if tests pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CLI image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cli
          push: false
          tags: mini-sast-cli:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: mini-sast-api:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max