spring:
  application:
    name: mini-sast-api

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Mini SAST API
    version: 0.1.0
    description: Static Application Security Testing REST API