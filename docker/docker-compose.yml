# Mini SAST — Local Development Environment
#
# Usage:
#   Start API:          docker compose up api
#   Scan current dir:   docker compose run --rm cli scan /scan
#   Build images:       docker compose build

version: "3.8"

services:

  # ── REST API ───────────────────────────────────────────────
  api:
    build:
      context: ..                      # project root
      dockerfile: docker/Dockerfile.api
    image: mini-sast-api:local
    container_name: mini-sast-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider",
             "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ── CLI Scanner ────────────────────────────────────────────
  # Not started by default — use `docker compose run --rm cli`
  cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cli
    image: mini-sast-cli:local
    volumes:
      # Mount current working directory as read-only inside container
      # Users run from their project root:
      #   cd /path/to/my-project
      #   docker compose -f /path/to/mini-sast/docker/docker-compose.yml \
      #     run --rm cli scan /scan
      - .:/scan:ro
    profiles:
      - cli                            # not started with `docker compose up`